
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billionaire Quiz Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#29200b,#090909 65%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.game{width:100%;max-width:650px;background:#151515;border:1px solid #b78b24;border-radius:22px;padding:28px;box-shadow:0 0 35px #c18c2633;text-align:center}
h1{color:#f5c957;font-size:30px;margin:5px 0}
.sub{color:#c6b47c;margin-bottom:25px}
.gold{color:#f5c957}
.stats{display:flex;justify-content:space-between;gap:10px;margin:20px 0}
.stat{background:#242019;border:1px solid #69501d;border-radius:12px;padding:12px;flex:1;color:#f5c957}
#question{font-size:21px;line-height:1.5;margin:28px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{cursor:pointer;border-radius:12px;padding:15px;font-size:15px;font-weight:bold}
.answer{background:#242424;border:1px solid #a77b23;color:white}
.answer:hover{background:#493713;border-color:#f5c957}
.answer:disabled{cursor:default;opacity:1}
.correct{background:#145d32!important;border-color:#42dc83!important}
.wrong{background:#752222!important;border-color:#ff7777!important}
#timer{font-size:19px;color:#f5c957}
#feedback{min-height:48px;margin:18px 0;color:#f5d77f;line-height:1.5}
.mainbtn{background:linear-gradient(120deg,#f5d77f,#bd8622);border:0;color:#17120a;padding:15px 30px}
.hidden{display:none}
.progress{height:7px;background:#333;border-radius:9px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#e6b843;transition:.3s}
@media(max-width:480px){.game{padding:19px}.answers{grid-template-columns:1fr}h1{font-size:25px}#question{font-size:19px}}
</style>
</head>
<body>
<div class="game">
<h1>👑 BILLIONAIRE</h1>
<div class="sub">QUIZ MASTER • THINK. PLAY. WIN.</div>

<div id="start">
<p>Test your knowledge and become a Quiz Millionaire!</p>
<p class="gold">50 Questions • 30 Seconds • Big Brain Challenge</p>
<p>🏆 Best Score: <b id="best">0</b></p>
<button class="mainbtn" onclick="startGame()">START GAME</button>
</div>

<div id="play" class="hidden">
<div class="stats">
<div class="stat">SCORE<br><b id="score">0</b></div>
<div class="stat">QUESTION<br><b id="number">1/50</b></div>
<div class="stat">TIME<br><b id="timer">30</b></div>
</div>
<div class="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button class="mainbtn hidden" id="next" onclick="nextQuestion()">NEXT QUESTION →</button>
</div>

<div id="end" class="hidden">
<h2 class="gold">🏆 GAME COMPLETED!</h2>
<h1 id="finalScore">0</h1>
<p id="result"></p>
<p>Your best score: <b id="endBest" class="gold"></b></p>
<button class="mainbtn" onclick="startGame()">PLAY AGAIN</button>
</div>
</div>

<script>
const questions = [
["Which company developed the Windows operating system?",["Apple","Microsoft","Google","IBM"],1,"Microsoft developed Windows."],
["What does CPU stand for?",["Central Processing Unit","Computer Power Unit","Core Program Utility","Central Print Unit"],0,"CPU means Central Processing Unit."],
["Which planet is known as the Red Planet?",["Venus","Jupiter","Mars","Mercury"],2,"Mars looks reddish because of iron oxide on its surface."],
["Who founded Microsoft with Paul Allen?",["Steve Jobs","Bill Gates","Mark Zuckerberg","Larry Page"],1,"Bill Gates co-founded Microsoft in 1975."],
["What does HTML stand for?",["Hyper Trainer Marking Language","HyperText Markup Language","HighText Machine Language","Hyper Transfer Main Link"],1,"HTML is used to structure web pages."],
["Which company makes the iPhone?",["Samsung","Apple","Sony","Nokia"],1,"Apple designs and sells the iPhone."],
["What is the largest planet in our solar system?",["Earth","Saturn","Jupiter","Neptune"],2,"Jupiter is the largest planet."],
["Which language is widely used for web styling?",["Python","CSS","C++","Java"],1,"CSS controls the appearance of web pages."],
["What does AI stand for?",["Automated Internet","Artificial Intelligence","Advanced Interface","Applied Information"],1,"AI stands for Artificial Intelligence."],
["Which is the fastest land animal?",["Lion","Horse","Cheetah","Leopard"],2,"The cheetah is the fastest land animal."],
["Who founded Facebook?",["Elon Musk","Mark Zuckerberg","Jeff Bezos","Bill Gates"],1,"Mark Zuckerberg launched Facebook in 2004."],
["Which gas do plants absorb?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2,"Plants absorb carbon dioxide during photosynthesis."],
["What is the currency of Japan?",["Won","Yuan","Yen","Dollar"],2,"Japan uses the Japanese yen."],
["Which company created Android?",["Microsoft","Google","Apple","Intel"],1,"Google leads Android development."],
["How many bits are in one byte?",["4","8","16","32"],1,"One byte contains eight bits."],
["Which ocean is the largest?",["Atlantic","Indian","Arctic","Pacific"],3,"The Pacific Ocean is the largest."],
["What does URL stand for?",["Uniform Resource Locator","Universal Record Link","User Reference Line","Unified Resource List"],0,"URL means Uniform Resource Locator."],
["Which device measures temperature?",["Barometer","Thermometer","Altimeter","Hygrometer"],1,"A thermometer measures temperature."],
["Who is associated with the invention of the World Wide Web?",["Tim Berners-Lee","Alan Turing","Charles Babbage","Dennis Ritchie"],0,"Tim Berners-Lee invented the World Wide Web."],
["Which is the smallest prime number?",["0","1","2","3"],2,"Two is the smallest prime number."],
["What does USB stand for?",["Universal Serial Bus","United System Board","User Storage Box","Universal Software Base"],0,"USB means Universal Serial Bus."],
["Which animal is the largest mammal?",["Elephant","Blue whale","Giraffe","Great white shark"],1,"The blue whale is the largest mammal."],
["Which company makes PlayStation?",["Microsoft","Nintendo","Sony","Sega"],2,"PlayStation is a Sony gaming brand."],
["What is the brain of a computer commonly called?",["Monitor","CPU","Keyboard","Mouse"],1,"The CPU executes instructions and processes data."],
["Which planet has prominent rings?",["Mars","Saturn","Earth","Mercury"],1,"Saturn is famous for its extensive ring system."],
["What does Wi-Fi allow devices to do?",["Print without ink","Connect wirelessly to a network","Charge faster","Increase screen size"],1,"Wi-Fi provides wireless network connectivity."],
["Which is the largest continent?",["Africa","Europe","Asia","Australia"],2,"Asia is the largest continent by area."],
["Who developed the Python programming language?",["Guido van Rossum","James Gosling","Brendan Eich","Dennis Ritchie"],0,"Guido van Rossum created Python."],
["What is the chemical symbol for gold?",["Ag","Gd","Au","Go"],2,"Au comes from the Latin word aurum."],
["Which company owns YouTube?",["Meta","Google","Amazon","Netflix"],1,"YouTube is owned by Google, under Alphabet."],
["What is the main function of RAM?",["Permanent storage","Temporary working memory","Printing documents","Cooling the CPU"],1,"RAM temporarily stores data used by active programs."],
["Which country is famous for the Great Wall?",["India","China","Japan","Thailand"],1,"The Great Wall is in China."],
["What does GPS stand for?",["Global Positioning System","General Path Service","Geographic Power Source","Global Program Signal"],0,"GPS means Global Positioning System."],
["Which is the closest star to Earth?",["Sirius","Sun","Proxima Centauri","Polaris"],1,"The Sun is Earth's nearest star."],
["Which technology is used for cryptocurrencies?",["Blockchain","Bluetooth","HTML","GPS"],0,"Many cryptocurrencies use blockchain technology."],
["Which company makes the Galaxy smartphone series?",["Apple","Samsung","Xiaomi","OnePlus"],1,"Samsung makes Galaxy smartphones."],
["What is the hardest naturally occurring mineral?",["Quartz","Diamond","Iron","Granite"],1,"Diamond is the hardest natural mineral on the Mohs scale."],
["What does PDF stand for?",["Portable Document Format","Personal Data File","Printed Document Form","Program Data Format"],0,"PDF means Portable Document Format."],
["Which organ pumps blood through the body?",["Lungs","Liver","Heart","Kidneys"],2,"The heart pumps blood through the circulatory system."],
["Which programming language is known for its use in Android development?",["Kotlin","HTML","SQL","CSS"],0,"Kotlin is a major language for Android development."],
["Which is the largest internal organ in the human body?",["Heart","Liver","Lung","Kidney"],1,"The liver is the largest internal organ."],
["What does HTTPS add to HTTP?",["Image compression","Encryption and secure communication","More screen resolution","Faster typing"],1,"HTTPS uses TLS to secure communication."],
["Which company created the Chrome browser?",["Mozilla","Google","Apple","Opera"],1,"Google developed Chrome."],
["How many sides does a hexagon have?",["Five","Six","Seven","Eight"],1,"A hexagon has six sides."],
["Which planet is famous for the Great Red Spot?",["Mars","Jupiter","Venus","Neptune"],1,"Jupiter's Great Red Spot is a giant storm."],
["What is the full form of QR in QR Code?",["Quick Response","Quality Reading","Query Record","Quick Register"],0,"QR means Quick Response."],
["Which component displays images from a computer?",["Keyboard","Monitor","Router","Microphone"],1,"A monitor displays visual output."],
["Which scientist is famous for the theory of relativity?",["Isaac Newton","Albert Einstein","Galileo","Nikola Tesla"],1,"Albert Einstein developed the theories of relativity."],
["What does SSD stand for?",["Solid State Drive","System Storage Disk","Secure Software Device","Serial Storage Data"],0,"SSD means Solid State Drive."]
];

let index=0, score=0, time=30, clock=null, locked=false;
let best=Number(localStorage.getItem("bqmBest")||0);
document.getElementById("best").textContent=best;

function startGame(){
 clearInterval(clock);index=0;score=0;
 document.getElementById("start").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("play").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 locked=false;time=30;
 const q=questions[index];
 document.getElementById("number").textContent=(index+1)+"/"+questions.length;
 document.getElementById("score").textContent=score;
 document.getElementById("timer").textContent=time;
 document.getElementById("bar").style.width=(index/questions.length*100)+"%";
 document.getElementById("question").textContent=q[0];
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 const area=document.getElementById("answers");area.innerHTML="";
 q[1].forEach((answer,i)=>{
  const b=document.createElement("button");
  b.className="answer";b.textContent=String.fromCharCode(65+i)+". "+answer;
  b.onclick=()=>choose(i);area.appendChild(b);
 });
 clock=setInterval(()=>{
  time--;document.getElementById("timer").textContent=time;
  if(time<=0){clearInterval(clock);choose(-1);}
 },1000);
}
function choose(choice){
 if(locked)return;locked=true;clearInterval(clock);
 const q=questions[index],buttons=document.querySelectorAll(".answer");
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q[2])b.classList.add("correct");
  else if(i===choice)b.classList.add("wrong");
 });
 if(choice===q[2]){score+=100;document.getElementById("feedback").textContent="✅ Correct! +100 points. "+q[3];}
 else document.getElementById("feedback").textContent="❌ "+(choice===-1?"Time is up! ":"Not quite! ")+q[3];
 document.getElementById("score").textContent=score;
 document.getElementById("next").textContent=index===questions.length-1?"SEE RESULTS":"NEXT QUESTION →";
 document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){
 index++;
 if(index>=questions.length){finishGame();return;}
 showQuestion();
}
function finishGame(){
 document.getElementById("play").classList.add("hidden");
 document.getElementById("end").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score+" POINTS";
 document.getElementById("result").textContent=score>=4000?"Outstanding! You are a Quiz Master!":score>=2500?"Great job! Keep learning!":"Good effort! Try again to improve your score.";
 if(score>best){best=score;localStorage.setItem("bqmBest",best);}
 document.getElementById("endBest").textContent=best;
 document.getElementById("best").textContent=best;
}
</script>
</body>
</html>
